name: Build and test extension
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: cargo test --locked -p requant-extension-core
      - run: cargo clippy --locked -p requant-extension-core --all-targets -- -D warnings
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: requant-wallet-extension-chromium
          path: artifacts/*
          if-no-files-found: error
